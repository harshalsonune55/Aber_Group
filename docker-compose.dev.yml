# Development overlay: hot reload, exposed ports, a fake SMTP inbox.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

name: aber

services:
  db:
    ports: ["5432:5432"]

  redis:
    ports: ["6379:6379"]

  minio:
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console

  api:
    build:
      target: runtime
    command:
      - uvicorn
      - aber.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    environment:
      ABER_DEBUG: "true"
      ABER_LOG_JSON: "false"
      ABER_LOG_LEVEL: DEBUG
      ABER_DB_ECHO: "false"
      ABER_SMTP_HOST: mailhog
      ABER_SMTP_PORT: "1025"
    ports: ["8000:8000"]
    volumes:
      # Bind-mounted so edits reload without a rebuild.
      - ./apps/api/src:/app/src
      - ./apps/api/migrations:/app/migrations

  worker:
    command:
      - watchmedo
      - auto-restart
      - --directory=/app/src
      - --pattern=*.py
      - --recursive
      - --
      - celery
      - -A
      - aber.workers.celery_app:celery_app
      - worker
      - --loglevel=debug
      - --concurrency=2
      - --queues=default,odoo_push,odoo_pull,notify,reports
    volumes:
      - ./apps/api/src:/app/src

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox
    networks: [internal]

  # Job monitoring. Behind auth in production; wide open only here.
  flower:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command:
      - celery
      - -A
      - aber.workers.celery_app:celery_app
      - flower
      - --port=5555
    environment:
      ABER_CELERY_BROKER_URL: redis://redis:6379/1
    ports: ["5555:5555"]
    depends_on: [redis]
    networks: [internal]
