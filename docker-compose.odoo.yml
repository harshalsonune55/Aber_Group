# Odoo, on its own compose file and its own database.
#
# Two deliberate choices:
#   * Odoo gets a SEPARATE Postgres instance, not a second database on ours.
#     Odoo's upgrade scripts and ours should never share a server, and an Odoo
#     vacuum storm must not touch our latency.
#   * Addons are bind-mounted from odoo/addons so the sync integration tests run
#     against the same code that ships.
#
#   docker compose -f docker-compose.yml -f docker-compose.odoo.yml up

name: aber

services:
  odoo-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
      POSTGRES_DB: postgres
    volumes:
      - odoodbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  odoo:
    image: odoo:18.0
    restart: unless-stopped
    depends_on:
      odoo-db: {condition: service_healthy}
    environment:
      HOST: odoo-db
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:-odoo}
    volumes:
      - odoodata:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons:ro
      - ./odoo/config/odoo.conf:/etc/odoo/odoo.conf:ro
    ports:
      # Exposed for the Odoo web UI during development. In production Odoo sits
      # behind Caddy on an internal hostname and this mapping is removed.
      - "8069:8069"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8069/web/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks: [internal]

volumes:
  odoodbdata:
  odoodata:
