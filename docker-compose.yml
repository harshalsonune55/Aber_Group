# Base stack: everything the API needs to serve traffic.
# Odoo lives in docker-compose.odoo.yml, observability in docker-compose.obs.yml,
# so an Odoo problem can never take the core stack down with it.
#
#   docker compose up -d
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up

name: aber

x-api-env: &api-env
  ABER_ENV: ${ABER_ENV:-development}
  ABER_DATABASE_URL: postgresql+asyncpg://aber:${POSTGRES_PASSWORD:-aber}@db:5432/aber
  ABER_DATABASE_URL_SYNC: postgresql+psycopg://aber:${POSTGRES_PASSWORD:-aber}@db:5432/aber
  ABER_REDIS_URL: redis://redis:6379/0
  ABER_CELERY_BROKER_URL: redis://redis:6379/1
  ABER_CELERY_RESULT_BACKEND: redis://redis:6379/2
  ABER_S3_ENDPOINT_URL: http://minio:9000
  ABER_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  ABER_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  ABER_ODOO_URL: ${ABER_ODOO_URL:-http://odoo:8069}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aber
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aber}
      POSTGRES_DB: aber
      # Explicit locale so trigram search ordering is identical everywhere.
      LANG: en_US.utf8
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aber -d aber"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [internal]

  # One-shot: creates the buckets and turns on versioning for documents, so an
  # overwritten passport scan is recoverable.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/aber-documents &&
      mc mb --ignore-existing local/aber-media &&
      mc version enable local/aber-documents &&
      echo 'buckets ready'
      "
    networks: [internal]
    restart: "no"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *api-env
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks: [internal]

  # Migrations run as their own one-shot service rather than in the API's
  # entrypoint, so scaling the API to N replicas cannot race N migration runs.
  migrate:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
    networks: [internal]
    restart: "no"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - celery
      - -A
      - aber.workers.celery_app:celery_app
      - worker
      - --loglevel=info
      - --concurrency=4
      - --queues=default,odoo_push,odoo_pull,notify,reports
    environment: *api-env
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]

  beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - celery
      - -A
      - aber.workers.celery_app:celery_app
      - beat
      - --loglevel=info
      - --scheduler=redbeat.RedBeatScheduler
    environment: *api-env
    env_file: [.env]
    depends_on:
      redis: {condition: service_healthy}
    networks: [internal]

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ABER_DOMAIN: ${ABER_DOMAIN:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api]
    networks: [internal, public]

networks:
  # Only Caddy straddles both. Postgres, Redis and MinIO are never reachable
  # from outside the host.
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
