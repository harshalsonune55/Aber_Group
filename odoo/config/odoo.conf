[options]
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

db_host = odoo-db
db_port = 5432
db_user = odoo
db_password = odoo

; Only the aber database is visible. Without this an operator can reach the
; database manager and drop or duplicate the production database from the web UI.
dbfilter = ^aber$
list_db = False

; Set a real value before exposing Odoo on any network.
admin_passwd = CHANGE_ME_BEFORE_DEPLOY

workers = 2
max_cron_threads = 1
limit_time_cpu = 120
limit_time_real = 240
limit_memory_soft = 1073741824
limit_memory_hard = 1610612736

proxy_mode = True
log_level = info
