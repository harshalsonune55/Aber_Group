# Render blueprint — the API and Postgres. Two resources, deliberately minimal.
#
# SCOPE: demos, staging, and sharing a working URL with the client. This is NOT
# the production target. Render has no UAE region, and the platform handles
# employee passport scans, Emirates ID numbers, salary data and GPS attendance.
# Production runs on a UAE-region host — see docs/runbooks/hosting-the-backend.md.
#
# Use: Render dashboard -> New -> Blueprint -> select this repo -> Apply.

databases:
  - name: aber-db
    databaseName: aber
    user: aber
    plan: free
    region: frankfurt
    # Match the production target so version-specific SQL breaks here first,
    # not on the UAE server.
    postgresMajorVersion: "16"

services:
  - type: web
    name: aber-api
    runtime: docker
    repo: https://github.com/harshalsonune55/Aber_Group
    branch: main
    plan: free
    region: frankfurt          # must match the database to reach it privately
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health   # liveness only — never /health/ready
    envVars:
      - key: ABER_ENV
        value: staging
      - key: ABER_DEBUG
        value: "false"
      - key: ABER_LOG_JSON
        value: "true"

      # Render emits a bare postgresql:// URL. Settings rewrites it onto the
      # asyncpg driver and derives the psycopg URL Alembic needs, so this single
      # variable is all the database configuration required.
      - key: ABER_DATABASE_URL
        fromDatabase:
          name: aber-db
          property: connectionString

      # Generated once by Render and stored encrypted. A worker added later must
      # reference these exact values, or data encrypted by one process cannot be
      # read by the other.
      - key: ABER_FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: ABER_ODOO_WEBHOOK_SECRET
        generateValue: true

      # Free instances get 512 MB; more workers only causes swapping.
      - key: WEB_CONCURRENCY
        value: "2"
      # Safe while there is a single instance. With more than one, turn this off
      # and run `alembic upgrade head` as a pre-deploy command instead —
      # otherwise instances race applying the same migration.
      - key: RUN_MIGRATIONS_ON_START
        value: "true"

# ---------------------------------------------------------------------------
# Not here yet, and why
#
# Redis / Key Value: nothing in a request path touches it. It is the Celery
# broker, read only by the worker process, so the API serves fine without it —
# verified by running the container with no ABER_REDIS_URL set at all. Adding it
# now would burn a slot against Render's per-workspace resource limit for
# something unused.
#
# Worker: Render's free plan does not support background workers (`free` is
# unavailable for private services, workers and cron jobs), and including one
# fails the entire blueprint. The beat schedule is empty until M2 anyway.
#
# Both arrive together with the Odoo sync tasks in M2, on a paid instance type:
